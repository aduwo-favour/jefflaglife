name: money-job
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'seed or drain', default: 'drain' }
      to: { description: 'target id (drain only)', default: '' }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aduwo-favour/accs-store
          token: ${{ secrets['STORE_TOKEN'] }}
          path: store
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node move.js
        env:
          MODE: ${{ inputs.mode }}
          TO: ${{ inputs.to }}
          TEMPLATE_U: ${{ secrets['TEMPLATE_U'] }}
          TEMPLATE_P: ${{ secrets['TEMPLATE_P'] }}
