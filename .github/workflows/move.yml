name: move-job
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3600000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aduwo-favour/accs-store
          token: ${{ secrets['STORE_TOKEN'] }}
          path: store
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node move.js
